services:
  car-predict:
    build: .
    container_name: car-predict
    ports:
      - "8000:8000"
    env_file:
      - .env
    # volumes:
      # Mount your locally-trained artifacts directory into the container.
      # The training scripts produce ./artifacts/script17/ and ./artifacts/script21/.
      # - ./artifacts:/app/artifacts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
